<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="datacoTitle datacoDesc">
  <title id="datacoTitle">DataCo Late Delivery Risk Detection Dashboard</title>
  <desc id="datacoDesc">Illustration showing shipment orders, risk scores, confusion matrix metrics and trade-off curve.</desc>
  <defs>
    <linearGradient id="bgDataCo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#18223c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="lateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bgDataCo)"/>
  <circle cx="800" cy="80" r="160" fill="#38bdf8" opacity="0.08"/>
  <circle cx="100" cy="480" r="200" fill="#818cf8" opacity="0.08"/>

  <!-- Main Card Container -->
  <g filter="url(#softShadow)">
    <rect x="70" y="55" width="760" height="450" rx="24" fill="#ffffff" opacity="0.97"/>

    <!-- Header bar inside card -->
    <rect x="70" y="55" width="760" height="56" rx="24" fill="#0f172a"/>
    <rect x="70" y="85" width="760" height="26" fill="#0f172a"/>
    <circle cx="106" cy="83" r="6" fill="#ef4444"/>
    <circle cx="124" cy="83" r="6" fill="#f59e0b"/>
    <circle cx="142" cy="83" r="6" fill="#10b981"/>
    <text x="170" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">DataCo Supply Chain Analytics &middot; Order Release Risk Engine</text>
    <rect x="680" y="71" width="125" height="24" rx="12" fill="#1e293b"/>
    <text x="696" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Order Release Mode</text>

    <!-- Top KPI cards -->
    <g transform="translate(100, 130)">
      <!-- KPI 1: Orders Evaluated -->
      <rect x="0" y="0" width="165" height="78" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Analyzed Orders</text>
      <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0f172a">62,897</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#059669">Non-cancelled scope</text>

      <!-- KPI 2: Base Late Rate -->
      <rect x="180" y="0" width="165" height="78" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Standard Class Late</text>
      <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#e11d48">57.3%</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">Primary shipping lane</text>

      <!-- KPI 3: Clean Features -->
      <rect x="360" y="0" width="165" height="78" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Feature Integrity</text>
      <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0284c7">0 Leakage</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#0284c7">Pre-dispatch only</text>

      <!-- KPI 4: Asymmetric Penalty -->
      <rect x="540" y="0" width="160" height="78" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Penalty Ratio</text>
      <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#7c3aed">5x - 10x</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#7c3aed">Miss vs. False Alarm</text>
    </g>

    <!-- Lower Section: Visual Graphs -->
    <!-- Left Graph Box: Risk distribution -->
    <g transform="translate(100, 230)">
      <rect x="0" y="0" width="375" height="245" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Temporal Decision Threshold vs. Late Delivery Risk</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Out-of-time TimeSeriesSplit evaluation across order batches</text>

      <!-- Chart axes -->
      <line x1="45" y1="205" x2="350" y2="205" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="45" y1="75" x2="45" y2="205" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Grid lines -->
      <line x1="45" y1="165" x2="350" y2="165" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="45" y1="125" x2="350" y2="125" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="45" y1="85" x2="350" y2="85" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Curve 1: Recall Curve (Blue) -->
      <path d="M45 90 C 100 95, 160 115, 230 145 C 280 170, 320 195, 345 203" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Curve 2: Cost Penalty Curve (Red/Orange) -->
      <path d="M45 195 C 100 185, 170 165, 230 142 C 280 120, 320 90, 345 80" fill="none" stroke="url(#lateGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Optimal threshold dotted line -->
      <line x1="230" y1="75" x2="230" y2="205" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="185" y="65" width="90" height="20" rx="6" fill="#4f46e5"/>
      <text x="194" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Optimal Threshold</text>

      <text x="240" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b">Dispatch Decision Threshold</text>
    </g>

    <!-- Right Box: Decision & Lineage Audit -->
    <g transform="translate(495, 230)">
      <rect x="0" y="0" width="305" height="245" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Dispatch Action Protocol</text>

      <g transform="translate(18, 50)">
        <!-- Step 1 -->
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1">1</text>
        <text x="32" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Pre-Dispatch Audit</text>
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b">Exclude post-dispatch leaks (Days for shipping)</text>

        <!-- Step 2 -->
        <circle cx="12" cy="55" r="12" fill="#fef3c7"/>
        <text x="8" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#b45309">2</text>
        <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Risk Classification</text>
        <text x="32" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b">Identify late risk for Standard Class orders</text>

        <!-- Step 3 -->
        <circle cx="12" cy="98" r="12" fill="#fee2e2"/>
        <text x="8" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">3</text>
        <text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Cost-Weighted Action</text>
        <text x="32" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b">Prioritize carrier expediting on flagged high-risk items</text>

        <!-- Step 4 -->
        <circle cx="12" cy="141" r="12" fill="#dcfce7"/>
        <text x="8" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803d">4</text>
        <text x="32" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Continuous Monitoring</text>
        <text x="32" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#64748b">Retrospective validation against temporal shifts</text>
      </g>
    </g>
  </g>
</svg>