    <line x1="154" y1="404" x2="746" y2="404" stroke="#dbe4ef" stroke-width="2"/>
    <line x1="154" y1="348" x2="746" y2="348" stroke="#e8eef6" stroke-width="2"/>
    <line x1="154" y1="292" x2="746" y2="292" stroke="#e8eef6" stroke-width="2"/>
