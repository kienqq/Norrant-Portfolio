    <text x="136" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Revenue</text>
    <text x="136" y="166" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#2563eb">+18.4%</text>
    <text x="352" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Demand</text>
    <text x="352" y="166" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#059669">Stable</text>
    <text x="568" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Prediction interval</text>
    <text x="568" y="166" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#334155">90%</text>
