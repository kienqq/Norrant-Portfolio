<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Sales forecasting dashboard illustration</title>
  <desc id="desc">A local abstract dashboard image with forecast lines, bars, and data cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#10284a"/>
      <stop offset="1" stop-color="#162b35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <circle cx="730" cy="70" r="180" fill="#60a5fa" opacity="0.10"/>
  <circle cx="140" cy="500" r="220" fill="#10b981" opacity="0.08"/>
  <g filter="url(#shadow)">
